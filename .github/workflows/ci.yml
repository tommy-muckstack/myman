name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  brain-plugin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/brain/package-lock.json
      - run: npm ci --ignore-scripts --prefix integrations/brain
      - run: npm test --prefix integrations/brain
      - run: npm run check-bundle --prefix integrations/brain
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (debug)
        run: swift build
      - name: Build (release, universal)
        run: swift build -c release --arch arm64 --arch x86_64
