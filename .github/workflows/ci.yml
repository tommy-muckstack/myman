name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  # One run per branch/PR. Superseded pull_request runs are cancelled. Every
  # other event (pushes to main, tags, releases, manual runs) gets a unique
  # group via run_id, so those runs are never cancelled or dropped from the queue.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  brain-plugin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/brain/package-lock.json
      - run: npm ci --ignore-scripts --prefix integrations/brain
      - run: npm test --prefix integrations/brain
      - run: npm run check-bundle --prefix integrations/brain
      - run: npm ci --ignore-scripts --prefix integrations/font-workbench
      - run: npm run typecheck --prefix integrations/font-workbench
      - run: npm test --prefix integrations/font-workbench
      - run: npm run check-bundle --prefix integrations/font-workbench
  sharing-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: integrations/share-service/package-lock.json
      - run: npm ci --ignore-scripts --prefix integrations/share-service
      - run: npm test --prefix integrations/share-service
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (debug)
        run: swift build
      - name: Build (release, universal)
        run: swift build -c release --arch arm64 --arch x86_64
