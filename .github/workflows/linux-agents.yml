name: Linux agents

on:
  pull_request:
    paths:
      - 'integrations/brain/**'
      - 'integrations/linux/**'
      - 'integrations/app-server.mjs'
      - 'src/Resources/BrainCompanion/**'
      - 'scripts/install-linux.sh'
      - 'scripts/test-linux-wayland.sh'
      - '.github/workflows/linux-agents.yml'
      - 'mcp.json'
      - 'plugin.json'
      - 'docs/linux-agents.md'
  push:
    branches: [main]
    paths:
      - 'integrations/brain/**'
      - 'integrations/linux/**'
      - 'integrations/app-server.mjs'
      - 'src/Resources/BrainCompanion/**'
      - 'scripts/install-linux.sh'
      - 'scripts/test-linux-wayland.sh'
      - '.github/workflows/linux-agents.yml'
      - 'mcp.json'
      - 'plugin.json'
      - 'docs/linux-agents.md'
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  # One run per branch/PR. Superseded pull_request runs are cancelled. Every
  # other event (pushes to main, tags, releases, manual runs) gets a unique
  # group via run_id, so those runs are never cancelled or dropped from the queue.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            integrations/brain/package-lock.json
            integrations/linux/package-lock.json
      - name: Install desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth imagemagick scrot x11-utils x11-xserver-utils tesseract-ocr fonts-dejavu-core git sway grim
      - run: npm ci --ignore-scripts --prefix integrations/brain
      - run: npm ci --ignore-scripts --prefix integrations/linux
      - name: Verify existing Brain and committed macOS bundles
        run: |
          npm test --prefix integrations/brain
          npm run check-bundle --prefix integrations/brain
      - run: npm run check-bundle --prefix integrations/linux
      - name: Run CLI and MCP JSON contract against X11
        env:
          MYMAN_TEST_SYSTEM_POLICY: '1'
          WAYLAND_DISPLAY: forbidden-inherited-session
          XDG_SESSION_TYPE: wayland
          HYPRLAND_INSTANCE_SIGNATURE: forbidden-inherited-session
          SWAYSOCK: /nonexistent-inherited-session
        run: xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' npm test --prefix integrations/linux
      - name: Test native Wayland capture against a headless compositor
        env:
          WAYLAND_DISPLAY: forbidden-inherited-session
          SWAYSOCK: /nonexistent-inherited-session
          HYPRLAND_INSTANCE_SIGNATURE: forbidden-inherited-session
        run: bash scripts/test-linux-wayland.sh
      - run: npm run package --prefix integrations/linux
      - name: Test extracted release installer without node_modules
        run: |
          mkdir -p "$RUNNER_TEMP/myman-extracted"
          (cd .build/linux && sha256sum -c myman-linux-x64.tar.gz.sha256)
          tar -xzf .build/linux/myman-linux-x64.tar.gz -C "$RUNNER_TEMP/myman-extracted"
          export MYMAN_INSTALL_PREFIX="$RUNNER_TEMP/myman-installed"
          export MYMAN_BRAIN_ROOT="$RUNNER_TEMP/MyManBrain"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/myman-config"
          export XDG_STATE_HOME="$RUNNER_TEMP/myman-state"
          bash "$RUNNER_TEMP/myman-extracted/myman-linux-x64/scripts/install-linux.sh"
          bash "$RUNNER_TEMP/myman-extracted/myman-linux-x64/scripts/install-linux.sh"
          "$MYMAN_INSTALL_PREFIX/bin/myman" doctor --json
          "$MYMAN_INSTALL_PREFIX/bin/myman" actions --json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myman-linux-x64
          path: |
            .build/linux/myman-linux-x64.tar.gz
            .build/linux/myman-linux-x64.tar.gz.sha256
          if-no-files-found: error

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 15
    steps:
      - name: Install Arch runtime and test dependencies
        run: pacman -Syu --noconfirm --needed nodejs-lts-jod npm git imagemagick librsvg grim ttf-dejavu tesseract tesseract-data-eng xorg-server-xvfb xorg-xauth xorg-xdpyinfo xorg-xrandr scrot
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci --ignore-scripts --prefix integrations/brain
      - run: npm ci --ignore-scripts --prefix integrations/linux
      - name: Exercise CLI, MCP, annotations, OCR and installer on Arch
        run: xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp' npm test --prefix integrations/linux

  release:
    if: github.event_name == 'release'
    needs: [contract, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: myman-linux-x64
      - name: Attach Linux companion to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" myman-linux-x64.tar.gz myman-linux-x64.tar.gz.sha256 --clobber
